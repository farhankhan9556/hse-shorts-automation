name: Daily HSE Short

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Dubai"

jobs:
  create-hse-short:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run HSE generator
        run: python hse_generator.py
