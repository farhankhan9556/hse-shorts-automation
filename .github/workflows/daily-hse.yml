name: Daily HSE Short

on:
  workflow_dispatch:

  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Dubai"

jobs:
  create-hse-short:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create HSE video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python hse_generator.py

      - name: Check generated video
        run: |
          ls -lah assets/
          test -f assets/hse_source.mp4

      - name: Save HSE source video
        uses: actions/upload-artifact@v4
        with:
          name: hse-source-video
          path: assets/hse_source.mp4
          retention-days: 1
