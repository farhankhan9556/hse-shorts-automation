name: Daily HSE Short

on:
  workflow_dispatch:

  schedule:
    - cron: "15 8 * * *"
      timezone: "Asia/Dubai"

jobs:
  create-hse-short:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Pexels API key
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY is missing"
            exit 1
          fi

      - name: Create HSE Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python hse_generator.py

      - name: Check generated files
        run: |
          ls -lah assets/
          test -f assets/hse_short.mp4
          test -f assets/youtube_title.txt
          test -f assets/youtube_description.txt
          test -f assets/youtube_hashtags.txt

      - name: Save HSE Short and metadata
        uses: actions/upload-artifact@v4
        with:
          name: hse-short
          path: |
            assets/hse_short.mp4
            assets/youtube_title.txt
            assets/youtube_description.txt
            assets/youtube_hashtags.txt
          retention-days: 7
