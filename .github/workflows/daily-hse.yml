      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HSE generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python hse_generator.py

      - name: Save downloaded video
        uses: actions/upload-artifact@v4
        with:
          name: hse-source-video
          path: assets/hse_source.mp4
          retention-days: 1
